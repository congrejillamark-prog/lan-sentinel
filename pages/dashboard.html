<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Sentinel | Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/project.css" rel="stylesheet">

  <style>
    .dashboard-main {
      min-height: 100vh;
      background: #080808;
    }

    .dashboard-topbar {
      background: #101010 !important;
      border-bottom: 1px solid #303030;
    }

    .dashboard-topbar .navbar-text,
    .dashboard-topbar .dropdown-toggle {
      color: #fff !important;
    }

    .dashboard-title {
      border-left: 4px solid #e50914;
      padding-left: 14px;
    }

    .stat-card {
      background: #151515 !important;
      border: 1px solid #303030 !important;
      transition: .25s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      border-color: #e50914 !important;
      box-shadow: 0 0 18px rgba(229,9,20,.12) !important;
    }

    .stat-card i {
      font-size: 2rem;
      color: #e50914 !important;
    }

    .card-header {
      background: #1b1b1b !important;
      color: #fff !important;
      border-bottom: 1px solid #303030;
    }

    .progress {
      background: #292929;
      height: 12px;
      border-radius: 20px;
    }

    .progress-bar {
      background: #e50914 !important;
    }

    .table thead th {
      background: #202020;
      color: #fff;
      border-color: #333;
    }

    .table tbody td {
      color: #ddd;
      border-color: #303030;
    }

    .table tbody tr:hover {
      background: #252525;
    }

    .dropdown-menu {
      background: #181818;
      border: 1px solid #333;
    }

    .dropdown-item {
      color: #ddd;
    }

    .dropdown-item:hover {
      background: #350000;
      color: #fff;
    }

    .dashboard-alert {
      background: #260b0b;
      color: #ffb3b3;
      border: 1px solid #721c24;
    }

    .sidebar-brand {
      color: #fff;
    }

    .sidebar-brand i {
      color: #e50914;
    }

    .sidebar .nav-link i {
      color: #e50914;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e50914;
      margin-right: 6px;
    }

    @media(max-width: 991px) {
      .dashboard-main {
        min-height: auto;
      }
    }
  </style>
</head>

<body>
<div class="container-fluid">
  <div class="row">

    <!-- Desktop Sidebar -->
    <aside class="col-lg-2 d-none d-lg-block sidebar p-3">

      <a href="../index.html"
         class="sidebar-brand text-decoration-none fw-bold fs-5 d-block mb-4">
        <i class="bi bi-shield-check"></i> LAN Sentinel
      </a>

      <ul class="nav nav-pills flex-column gap-2">

        <li class="nav-item">
          <a href="dashboard.html" class="nav-link active">
            <i class="bi bi-speedometer2 me-2"></i>Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a href="#" class="nav-link">
            <i class="bi bi-bell me-2"></i>Alerts
          </a>
        </li>

        <li class="nav-item">
          <a href="#" class="nav-link">
            <i class="bi bi-hdd-network me-2"></i>Devices
          </a>
        </li>

        <li class="nav-item">
          <a href="#" class="nav-link">
            <i class="bi bi-file-earmark-text me-2"></i>Reports
          </a>
        </li>

        <li class="nav-item">
          <a href="#" class="nav-link">
            <i class="bi bi-gear me-2"></i>Settings
          </a>
        </li>

        <li class="nav-item mt-4">
          <a href="../index.html" class="nav-link">
            <i class="bi bi-box-arrow-left me-2"></i>Logout
          </a>
        </li>

      </ul>
    </aside>

    <!-- Main Dashboard -->
    <main class="col-lg-10 p-0 dashboard-main">

      <!-- Top Navigation -->
      <nav class="navbar dashboard-topbar shadow-sm px-3">

        <button class="btn btn-outline-secondary d-lg-none"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#mobileMenu"
                aria-label="Open menu">
          <i class="bi bi-list"></i>
        </button>

        <span class="navbar-text fw-semibold d-none d-sm-inline">
          <i class="bi bi-shield-lock text-brand me-2"></i>
          Network Dashboard
        </span>

        <div class="dropdown ms-auto">

          <a href="#"
             class="d-flex align-items-center text-decoration-none dropdown-toggle"
             data-bs-toggle="dropdown"
             aria-expanded="false">

            <i class="bi bi-person-circle fs-3 me-2 text-brand"></i>
            <span>Network Admin</span>

          </a>

          <ul class="dropdown-menu dropdown-menu-end">
