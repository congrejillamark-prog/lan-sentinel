<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Sentinel | Sign Up</title>

  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/project.css" rel="stylesheet">

  <style>
    body {
      background: #080808;
    }

    .auth-wrapper {
      min-height: 100vh;
    }

    .signup-form {
      max-width: 460px;
      width: 100%;
    }

    .auth-image.signup {
      position: relative;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(0,0,0,.94), rgba(100,0,0,.72)),
        url("../assets/images/signup.jpg") center/cover no-repeat !important;
      border-left: 1px solid #360000;
    }

    .brand-logo {
      color: #fff !important;
      letter-spacing: 1px;
    }

    .brand-logo i {
      color: #e50914;
    }

    .form-control,
    .form-select {
      background: #151515 !important;
      color: #fff !important;
      border: 1px solid #383838;
      padding: 11px;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #e50914;
      box-shadow: 0 0 0 .2rem rgba(229,9,20,.15);
    }

    .form-control::placeholder {
      color: #777;
    }

    .form-label {
      color: #ddd;
      font-size: .9rem;
    }

    .form-check-input {
      background-color: #222;
      border-color: #555;
    }

    .form-check-input:checked {
      background-color: #e50914;
      border-color: #e50914;
    }

    .btn-signup {
      background: #e50914;
      color: #fff;
      border: none;
      transition: .2s;
    }

    .btn-signup:hover {
      background: #a00008;
      color: #fff;
      box-shadow: 0 0 18px rgba(229,9,20,.3);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap .form-control {
      padding-right: 42px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      cursor: pointer;
      background: none;
      border: none;
    }

    .password-toggle:hover {
      color: #e50914;
    }

    .auth-heading {
      color: #fff;
    }

    .auth-description,
    .login-text {
      color: #999;
    }

    .auth-link {
      color: #ff3030;
      text-decoration: none;
    }

    .auth-link:hover {
      color: #ff7777;
    }

    .image-content {
      max-width: 480px;
    }

    .image-content h2 {
      font-size: 2.8rem;
    }

    .image-line {
      width: 65px;
      height: 4px;
      background: #e50914;
      margin-bottom: 20px;
    }

    @media(max-width: 991px) {
      .auth-image.signup {
        min-height: 260px;
        border-left: none;
      }
    }
  </style>
</head>

<body>

<div class="container-fluid">
  <div class="row auth-wrapper">

    <!-- Form Section -->
    <div class="col-lg-6 d-flex align-items-center justify-content-center py-5 px-4 order-2 order-lg-1">

      <div class="signup-form">

        <a href="../index.html"
           class="brand-logo fw-bold fs-4 text-decoration-none d-block mb-4">
          <i class="bi bi-shield-check"></i> LAN SENTINEL
        </a>

        <h3 class="auth-heading fw-bold">Create your account</h3>

        <p class="auth-description mb-4">
          Join LAN Sentinel and take control of your network security.
        </p>

        <form action="login.html" method="get">

          <!-- Name -->
          <div class="row g-3 mb-3">

            <div class="col-sm-6">
              <label for="first" class="form-label">First name</label>
              <input type="text"
                     class="form-control"
                     id="first"
                     name="first"
                     placeholder="Juan"
                     required>
            </div>

            <div class="col-sm-6">
              <label for="last" class="form-label">Last name</label>
              <input type="text"
                     class="form-control"
                     id="last"
                     name="last"
                     placeholder="Dela Cruz"
                     required>
            </div>

          </div>

          <!-- Email -->
          <div class="mb-3">

            <label for="email" class="form-label">Email address</label>

            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   placeholder="name@example.com"
                   required>

          </div>

          <!-- Role -->
          <div class="mb-3">

            <label for="course" class="form-label">Role</label>

            <select class="form-select" id="course" name="role" required>
              <option value="" selected disabled>Choose your role</op
